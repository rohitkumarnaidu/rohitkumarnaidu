name: WakaTime Stats

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wakatime-profile
  cancel-in-progress: true

jobs:
  update-readme:
    name: Refresh weekly coding breakdown
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update README WakaTime section
        uses: anmol098/waka-readme-stats@18146e87e945092519c11353547bf066daa99e46 # master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SHOW_OS: "True"
          SHOW_PROJECTS: "True"
          SHOW_COMMIT: "True"
          SHOW_DAYS_OF_WEEK: "True"
          SHOW_LANGUAGE: "True"
          SHOW_SHORT_INFO: "False"
          SHOW_LOC_CHART: "False"
          SHOW_PROFILE_DETAILS: "False"
          SHOW_LANGUAGE_PER_REPO: "True"
          SHOW_UPDATED_DATE: "True"
          SHOW_TOTAL_CODE_TIME: "True"
          SHOW_AI_CODE_TIME: "False"
          SHOW_AI_CODING: "False"
          SECTION_NAME: waka
          COMMIT_MESSAGE: "chore: refresh WakaTime metrics"
          LOCALE: "en"

      - name: Refresh visual WakaTime dashboard
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: python3 .github/scripts/update_wakatime_dashboard.py

      - name: Commit visual dashboard when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/svg/wakatime-dashboard.svg
          git diff --cached --quiet || git commit -m "chore: refresh visual WakaTime dashboard"
          git push
