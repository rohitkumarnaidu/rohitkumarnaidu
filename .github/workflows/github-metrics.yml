name: Update GitHub Counters

on:
  schedule:
    - cron: "45 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-github-counters
  cancel-in-progress: true

jobs:
  update:
    name: Refresh GitHub counters
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Query GitHub and update counters
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update_github_counters.py

      - name: Commit changed counters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: refresh GitHub profile counters"
          git push
