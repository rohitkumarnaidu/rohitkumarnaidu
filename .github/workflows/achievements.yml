name: Update Official GitHub Achievements

on:
  schedule:
    - cron: "20 1 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-achievements
  cancel-in-progress: true

jobs:
  update:
    name: Refresh official achievements
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Read official achievements and update README
        run: python3 .github/scripts/update_achievements.py

      - name: Commit changes when a new achievement appears
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: refresh official GitHub achievements"
          git push
