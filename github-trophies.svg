<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-labelledby="title desc">
  <title id="title">Rohith's engineering trophy cabinet</title>
  <desc id="desc">Verified milestones for pull requests, open-source merges, collaboration, and original repositories.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#17112e"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#94a3b8"/></linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  </defs>
  <rect width="1000" height="270" rx="22" fill="url(#bg)"/><rect x="1" y="1" width="998" height="268" rx="21" fill="none" stroke="#334155"/><rect width="1000" height="6" rx="3" fill="url(#neon)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="40" y="48" fill="#f8fafc" font-size="21" font-weight="800">ENGINEERING TROPHY CABINET</text><text x="40" y="73" fill="#94a3b8" font-size="13">Verified milestones · resilient self-hosted visual</text>
    <g transform="translate(40 94)"><rect width="215" height="138" rx="16" fill="#111827" stroke="#94a3b8"/><circle cx="107.5" cy="40" r="25" fill="url(#silver)"/><text x="107.5" y="49" text-anchor="middle" font-size="26">🏆</text><text x="107.5" y="88" fill="#f8fafc" text-anchor="middle" font-size="16" font-weight="700">PULL SHARK ×3</text><text x="107.5" y="113" fill="#cbd5e1" text-anchor="middle" font-size="12">SILVER TIER</text></g>
    <g transform="translate(275 94)"><rect width="215" height="138" rx="16" fill="#111827" stroke="#0891b2"/><circle cx="107.5" cy="40" r="25" fill="#164e63"/><text x="107.5" y="49" text-anchor="middle" font-size="26">🌍</text><text x="107.5" y="88" fill="#67e8f9" text-anchor="middle" font-size="16" font-weight="700">197 EXTERNAL</text><text x="107.5" y="113" fill="#cbd5e1" text-anchor="middle" font-size="12">OPEN-SOURCE MERGES</text></g>
    <g transform="translate(510 94)"><rect width="215" height="138" rx="16" fill="#111827" stroke="#8b5cf6"/><circle cx="107.5" cy="40" r="25" fill="#4c1d95"/><text x="107.5" y="49" text-anchor="middle" font-size="26">🤝</text><text x="107.5" y="88" fill="#c4b5fd" text-anchor="middle" font-size="16" font-weight="700">220 MERGED PRs</text><text x="107.5" y="113" fill="#cbd5e1" text-anchor="middle" font-size="12">COLLABORATION</text></g>
    <g transform="translate(745 94)"><rect width="215" height="138" rx="16" fill="#111827" stroke="#f59e0b"/><circle cx="107.5" cy="40" r="25" fill="url(#gold)"/><text x="107.5" y="49" text-anchor="middle" font-size="26">⚡</text><text x="107.5" y="88" fill="#fbbf24" text-anchor="middle" font-size="16" font-weight="700">18 ORIGINAL</text><text x="107.5" y="113" fill="#cbd5e1" text-anchor="middle" font-size="12">PUBLIC REPOSITORIES</text></g>
  </g>
</svg>
