<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Rohith Kumar — Computer Science Student and AI/ML Enthusiast</title>
  <desc id="description">A dark editorial developer banner with violet and cyan accents.</desc>

  <defs>
    <linearGradient id="background" x1="48" y1="12" x2="1150" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="0.52" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#07111D"/>
    </linearGradient>
    <linearGradient id="accent" x1="70" y1="0" x2="1110" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="0.52" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="name" x1="70" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.62" stop-color="#DDD6FE"/>
      <stop offset="1" stop-color="#A5F3FC"/>
    </linearGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientTransform="translate(135 68) rotate(29) scale(350 220)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientTransform="translate(1090 238) rotate(-151) scale(380 210)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0891B2" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#0891B2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#94A3B8" stroke-opacity="0.055"/>
    </pattern>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="300" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#background)"/>
    <rect width="1200" height="300" fill="url(#violetGlow)"/>
    <rect width="1200" height="300" fill="url(#cyanGlow)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

    <!-- Editorial index -->
    <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" letter-spacing="2.4">
      <text x="70" y="50" fill="#A78BFA">RK / 01</text>
      <text x="1130" y="50" fill="#64748B" text-anchor="end">PUDUCHERRY · INDIA</text>
    </g>

    <!-- Primary identity -->
    <text x="68" y="130" fill="url(#name)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="68" font-weight="750" letter-spacing="-2.2">Rohith Kumar</text>
    <text x="72" y="166" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="2.8">AI/ML  ×  DATA ANALYTICS  ×  FULL-STACK DEVELOPMENT</text>

    <!-- Focus line -->
    <rect x="70" y="196" width="5" height="5" rx="2.5" fill="#22D3EE"/>
    <circle cx="72.5" cy="198.5" r="8" fill="#22D3EE" fill-opacity="0.16" filter="url(#blur)"/>
    <text x="88" y="203" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="0.3">A student learning deeply, building openly, and growing toward platform engineering.</text>

    <!-- Compact technology rail -->
    <g transform="translate(70 232)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">
      <g>
        <rect width="78" height="28" rx="14" fill="#111827" stroke="#334155"/>
        <text x="39" y="18" fill="#C4B5FD" text-anchor="middle">REACT</text>
      </g>
      <g transform="translate(88)">
        <rect width="88" height="28" rx="14" fill="#111827" stroke="#334155"/>
        <text x="44" y="18" fill="#BAE6FD" text-anchor="middle">FASTAPI</text>
      </g>
      <g transform="translate(186)">
        <rect width="82" height="28" rx="14" fill="#111827" stroke="#334155"/>
        <text x="41" y="18" fill="#D8B4FE" text-anchor="middle">PYTHON</text>
      </g>
      <g transform="translate(278)">
        <rect width="104" height="28" rx="14" fill="#111827" stroke="#334155"/>
        <text x="52" y="18" fill="#A5F3FC" text-anchor="middle">TYPESCRIPT</text>
      </g>
      <g transform="translate(392)">
        <rect width="68" height="28" rx="14" fill="#111827" stroke="#334155"/>
        <text x="34" y="18" fill="#C4B5FD" text-anchor="middle">RAG</text>
      </g>
    </g>

    <!-- Abstract system map -->
    <g transform="translate(830 74)">
      <rect x="0" y="0" width="298" height="156" rx="18" fill="#0B1220" fill-opacity="0.8" stroke="#334155"/>
      <text x="24" y="31" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" letter-spacing="1.8">SYSTEM / SIGNAL</text>

      <g stroke-linecap="round">
        <path d="M51 79H111L145 53H210L246 88" stroke="#475569" stroke-width="1.2" stroke-dasharray="4 5"/>
        <path d="M51 79H111L154 116H246" stroke="url(#accent)" stroke-width="1.8"/>
      </g>

      <g>
        <circle cx="51" cy="79" r="9" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
        <circle cx="111" cy="79" r="9" fill="#111827" stroke="#6366F1" stroke-width="2"/>
        <circle cx="145" cy="53" r="7" fill="#111827" stroke="#64748B"/>
        <circle cx="154" cy="116" r="9" fill="#111827" stroke="#22D3EE" stroke-width="2"/>
        <circle cx="210" cy="53" r="7" fill="#111827" stroke="#64748B"/>
        <circle cx="246" cy="88" r="9" fill="#111827" stroke="#A78BFA" stroke-width="2"/>
        <circle cx="246" cy="116" r="9" fill="#111827" stroke="#22D3EE" stroke-width="2"/>
      </g>

      <g fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="8" letter-spacing="1">
        <text x="37" y="103">IDEA</text>
        <text x="91" y="103">DESIGN</text>
        <text x="138" y="137">BUILD</text>
        <text x="228" y="137">SHIP</text>
      </g>
    </g>

    <!-- Bottom rule -->
    <line x1="830" y1="251" x2="1128" y2="251" stroke="#334155"/>
    <text x="1128" y="271" fill="#64748B" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" letter-spacing="1.5">DISCOVER → DESIGN → BUILD → IMPROVE</text>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="299" rx="23.5" stroke="#334155" stroke-opacity="0.75"/>
</svg>
